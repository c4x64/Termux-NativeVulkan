plugins {
    id 'com.android.application'
}

android {
    namespace = "dev.tnvk.app"
    compileSdk = 34

    defaultConfig {
        applicationId = "dev.tnvk.app"
        minSdk = 28
        targetSdk = 34
        versionCode = 1
        versionName = "0.1.0"
        externalNativeBuild {
            cmake {
                cppFlags += "-std=c++17"
                arguments += "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
        }
    }
}

dependencies {
    // No external deps: framework Activity + views only (keeps APK lean,
    // avoids kotlin-stdlib duplicate-class conflicts).
}
